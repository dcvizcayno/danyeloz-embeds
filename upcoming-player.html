<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Danyel OZ: Upcoming Release: Player</title>
</head>
<body>
<!-- Danyel OZ: Upcoming Release, player card (embed 1 of 2)
     Paste into Google Sites: Insert > Embed > Embed code.
     Shows the next song in your Song Database whose release date is still ahead (Singapore time).
     The day it comes out, it moves on to the next one by itself. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600&family=Great+Vibes&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #ozu { position: relative; overflow: hidden; isolation: isolate; font-family: 'Oswald', 'Arial Narrow', sans-serif; color: #fff;
    background: #140405; border-radius: 6px; padding: 24px 22px 22px; width: 100%; box-sizing: border-box; }
  #ozu * { box-sizing: border-box; }
  /* the cover art, blurred and washed in red, sits behind everything */
  #ozu-bg { position: absolute; inset: -40px; z-index: -2; background: #140405 center / cover no-repeat;
    filter: blur(26px) saturate(.5) brightness(.9); transform: scale(1.1); }
  #ozu::before { content: ''; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(180deg, rgba(176,16,31,.55) 0%, rgba(110,8,18,.78) 45%, rgba(20,4,5,.96) 100%); }
  .ozu-label { font-family: 'Great Vibes', cursive; font-size: 34px; line-height: 1; color: #ffd2d6; margin: 0 0 2px; }
  .ozu-title { font-family: 'Anton', Impact, sans-serif; font-size: 46px; line-height: .98; letter-spacing: 1px;
    text-transform: uppercase; margin: 0 0 12px; text-shadow: 0 2px 18px rgba(0,0,0,.35); overflow-wrap: anywhere; }
  .ozu-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
  .ozu-tags:empty { display: none; }
  .ozu-date, .ozu-soon { display: inline-block; font-size: 12px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase;
    padding: 6px 12px; margin: 0; }
  .ozu-date { background: #e3122a; color: #fff; }
  .ozu-date:empty { display: none; }
  .ozu-soon { background: #fff; color: #b0101f; }
  #ozu-player iframe, #ozu-player img { display: block; margin: 0 auto; border: 0; border-radius: 4px;
    box-shadow: 0 22px 50px -18px rgba(0,0,0,.7); }
  #ozu-player iframe { background: #000; }
  #ozu-player img { object-fit: cover; background: rgba(0,0,0,.3); }
  .ozu-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .ozu-links a { flex: 1 1 120px; text-align: center; text-decoration: none; color: #fff; background: transparent;
    border: 1px solid rgba(255,255,255,.55); border-radius: 2px; font: 500 13px 'Oswald', 'Arial Narrow', sans-serif;
    letter-spacing: 2.5px; text-transform: uppercase; padding: 11px 10px; transition: background .2s, border-color .2s; }
  .ozu-links a:hover, .ozu-links a:focus-visible { background: #e3122a; border-color: #e3122a; outline: none; }
  .ozu-msg { font-size: 15px; color: #ffd2d6; margin: 0; }
  @media (max-width: 480px) {
    #ozu { padding: 16px 14px; }
    .ozu-label { font-size: 28px; }
    .ozu-title { font-size: 34px; }
    .ozu-links a { flex-basis: 45%; padding: 9px 8px; font-size: 12px; letter-spacing: 1.8px; }
  }
</style>

<div id="ozu">
  <div id="ozu-bg" aria-hidden="true"></div>
  <p class="ozu-label" id="ozu-label"></p>
  <p class="ozu-title" id="ozu-title">Loading…</p>
  <div class="ozu-tags" id="ozu-tags"><p class="ozu-date" id="ozu-date"></p></div>
  <div id="ozu-player"></div>
  <div class="ozu-links" id="ozu-links"></div>
</div>

<script>
(function () {
  /* ================= Settings ================= */
  var SONG        = 'next';          // 'next' = nearest upcoming release, or a song title / Apple ID from your sheet
  var LABEL       = 'Coming soon';   // handwritten line above the title ('' to hide)
  var DATE_PREFIX = 'Out ';          // text before the date
  var SOON_DAYS   = 7;               // show a "THIS WEEK" style badge within this many days (0 = never)
  var SHOW_LINKS  = true;            // platform buttons
  var NOTHING_TEXT = 'New music is on the way.';
  /* ============================================ */

  var TIME_ZONE = 'Asia/Singapore';
  var SHEET_ID  = '1WD98RYgWPURqwtczPYEblCOOPFutAIO1jf42oSfbzPw';
  var SHEET_CSV = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&gid=0';
  var LINKS = {
    spotify_link:    { name: 'Spotify',      url: 'https://open.spotify.com/artist/2rXzK2nhFFclSWxkpJ9XYn', ok: /^https:\/\/(open\.spotify\.com|spotify\.link)\//i },
    appl_music_link: { name: 'Apple Music',  url: 'https://music.apple.com/us/artist/danyel-oz/1706653995',  ok: /^https:\/\/(music|geo\.music|itunes)\.apple\.com\//i },
    yt_video_link:   { name: 'YouTube',      url: 'https://www.youtube.com/@danyeloz1554',                   ok: /^https:\/\/(www\.|m\.|music\.)?(youtube\.com|youtu\.be)\//i },
    amazon_link:     { name: 'Amazon Music', url: 'https://music.amazon.com/artists/B0CHPJX6SM',             ok: /^https:\/\/(music\.)?amazon\.[a-z.]+\/|^https:\/\/amzn\.to\//i }
  };

  function $(id) { return document.getElementById(id); }
  function norm(s) { return String(s || '').toLowerCase().replace(/ - (single|ep)$/, '').replace(/[’']/g, "'").replace(/\s+/g, ' ').trim(); }
  function parseCSV(t) {
    var rows = [], row = [], cur = '', q = false;
    for (var i = 0; i < t.length; i++) {
      var c = t[i];
      if (q) { if (c === '"' && t[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
      else if (c === '"') q = true; else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    var head = (rows.shift() || []).map(function (h) { return h.trim().toLowerCase(); });
    return rows.filter(function (r) { return r.join('').trim(); }).map(function (r) {
      var o = {}; head.forEach(function (h, k) { o[h] = (r[k] || '').trim(); }); return o;
    });
  }
  function todaySG() { return new Intl.DateTimeFormat('en-CA', { timeZone: TIME_ZONE }).format(new Date()); } // YYYY-MM-DD
  function isoDate(v) { var m = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : ''; }
  function daysUntil(iso) {
    var a = todaySG().split('-').map(Number), b = iso.split('-').map(Number);
    return Math.round((Date.UTC(b[0], b[1] - 1, b[2]) - Date.UTC(a[0], a[1] - 1, a[2])) / 86400000);
  }
  function niceDate(iso) {
    var p = iso.split('-').map(Number);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2])).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
  }
  function isImage(u) { return /^https:\/\//i.test(u) && (/\.(png|jpe?g|gif|webp)(\?|$)/i.test(u) || /drive\.google\.com|googleusercontent\.com|mzstatic\.com/i.test(u)); }
  function imageUrl(u) {
    if (!/drive\.google\.com/.test(u)) return u;
    var m = u.match(/\/d\/([\w-]+)/) || u.match(/[?&]id=([\w-]+)/);
    return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1000' : u;
  }

  /* Picks the nearest release whose date is after today, or the song named in SONG. */
  function pick(rows) {
    if (String(SONG).toLowerCase() !== 'next') {
      var want = norm(SONG);
      return rows.filter(function (r) { return String(r.song_id) === String(SONG).trim(); })[0] ||
             rows.filter(function (r) { return norm(r.song_title) === want; })[0] || null;
    }
    var today = todaySG();
    return rows.filter(function (r) { var d = isoDate(r.release_date); return d && d > today && r.song_title; })
      .sort(function (a, b) { return isoDate(a.release_date).localeCompare(isoDate(b.release_date)); })[0] || null;
  }

  /* Reads Bandcamp's embed code and keeps only its player address (the pasted HTML never runs). */

  /* Bandcamp's own colors follow the site theme: black player, red links */
  function themed(src) {
    src = /\/bgcol=/.test(src) ? src.replace(/\/bgcol=\w+/, '/bgcol=000000') : src.replace(/\/?$/, '/bgcol=000000/');
    src = /\/linkcol=/.test(src) ? src.replace(/\/linkcol=\w+/, '/linkcol=e3122a') : src.replace(/\/?$/, '/linkcol=e3122a/');
    return src;
  }

  function bandcamp(code) {
    var m = String(code || '').match(/src\s*=\s*["'](https:\/\/bandcamp\.com\/EmbeddedPlayer\/[\w=\/.-]+)["']/i);
    if (!m) return null;
    var src = m[1];
    var size = (src.match(/\/size=(\w+)/) || [])[1] || 'large';
    var art = (src.match(/\/artwork=(\w+)/) || [])[1] || '';
    var px = (String(code).match(/height\s*:\s*(\d+)px/i) || [])[1];
    var kind = /\/minimal=true/.test(src) ? 'square'
             : size === 'large' && art !== 'small' && art !== 'none' ? 'art' : 'strip';
    return { src: themed(src), kind: kind, height: px ? Number(px) : (kind === 'strip' ? (size === 'small' ? 42 : 120) : 0) };
  }

  function addLinks(row) {
    if (!SHOW_LINKS) return;
    Object.keys(LINKS).forEach(function (k) {
      var cfg = LINKS[k], own = String((row && row[k]) || '').trim();
      var a = document.createElement('a');
      a.href = own && cfg.ok.test(own) ? own : cfg.url;
      a.target = '_blank'; a.rel = 'noopener'; a.textContent = cfg.name;
      $('ozu-links').appendChild(a);
    });
  }

  fetch(SHEET_CSV).then(function (r) { return r.text(); }).then(parseCSV).catch(function () { return []; })
    .then(function (rows) {
      var s = pick(rows);
      $('ozu-label').textContent = LABEL; if (!LABEL) $('ozu-label').style.display = 'none';
      if (!s) {
        $('ozu-title').textContent = NOTHING_TEXT;
        $('ozu-title').style.fontSize = '20px';
        addLinks(null);
        return;
      }
      $('ozu-title').textContent = s.song_title;
      if (s.song_arts && isImage(s.song_arts)) $('ozu-bg').style.backgroundImage = 'url("' + imageUrl(s.song_arts).replace(/["\\]/g, '') + '")';
      var iso = isoDate(s.release_date);
      if (iso) {
        var d = daysUntil(iso);
        $('ozu-date').textContent = DATE_PREFIX + niceDate(iso);
        if (SOON_DAYS > 0 && d >= 0 && d <= SOON_DAYS) {
          var b = document.createElement('span'); b.className = 'ozu-soon';
          b.textContent = d === 0 ? 'TODAY' : d === 1 ? 'TOMORROW' : 'IN ' + d + ' DAYS';
          $('ozu-tags').appendChild(b);
        }
      }

      var bc = bandcamp(s.bandcamp_embed);
      if (bc) {
        var f = document.createElement('iframe');
        f.src = bc.src; f.title = 'Preview ' + s.song_title + ' on Bandcamp';
        f.setAttribute('seamless', ''); f.className = 'ozu-bc';
        f.dataset.kind = bc.kind; f.dataset.h = bc.height || '';
        $('ozu-player').appendChild(f);
      } else if (s.song_arts && isImage(s.song_arts)) {
        var img = document.createElement('img');
        img.alt = s.song_title + ' cover art'; img.src = imageUrl(s.song_arts); img.dataset.kind = 'cover';
        img.onload = fitPlayer;
        img.onerror = function () { img.remove(); fitPlayer(); };
        $('ozu-player').appendChild(img);
      }
      addLinks(s);
      fitPlayer();
    });

  /* Sizes the player or cover to the embed box, so it still fits when Google Sites shrinks the box on phones. */
  function fitPlayer() {
    var f = $('ozu-player').firstElementChild; if (!f) return;
    var other = $('ozu').offsetHeight - f.offsetHeight;
    var room = window.innerHeight - other - 4;
    var width = $('ozu-player').clientWidth;
    if (f.dataset.kind === 'strip') { f.style.width = '100%'; f.style.height = f.dataset.h + 'px'; return; }
    var extra = f.dataset.kind === 'art' ? 120 : 0;          // big Bandcamp player has controls under the cover
    var side = Math.max(160, Math.min(width, room - extra));
    f.style.width = side + 'px';
    f.style.height = (side + extra) + 'px';
  }
  window.addEventListener('resize', fitPlayer);
})();
</script>

</body>
</html>
