<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Danyel OZ: Contact &amp; Collaborations</title>
</head>
<body>
<!-- Danyel OZ: Contact & Collaborations form
     Google Sites: Insert > Embed > By URL: https://dcvizcayno.github.io/danyeloz-embeds/contact.html
     The form itself comes from forms-core.js (window.OZForms): heading, intro, fields, checks, privacy note and the
     send. Answers go to the "Danyel OZ contact" Google Form named in data/forms.json (written after the one-time
     setup in the admin Apps Script, see docs/SETUP.md). If forms.json is missing or invalid, or forms-core.js does not
     load, the page shows the email address as text instead.
     Google Sites frames embeds in a sandbox (no top navigation, no mailto), so the form sends in place and shows a
     thank-you message without leaving the page. Only the Privacy policy link opens a new tab.
     Nothing on this page reads the page address. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600&family=Great+Vibes&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0a0506; }
  #ozc { --red: #e3122a; --deep: #b0101f; --soft: #ff8a96; min-height: 100vh; padding: 40px 32px 36px; background: #0a0506; color: #fff;
    font-family: 'Open Sans', Arial, sans-serif; overflow-wrap: anywhere; box-sizing: border-box; }
  #ozc * { box-sizing: border-box; }

  #ozc .ozf { color: #fff; max-width: 760px; }
  #ozc .ozf-h { margin: 0 0 14px; font-size: 60px; line-height: .95; letter-spacing: 1px; color: #fff; }
  #ozc .ozf-h::after { content: ''; display: block; width: 56px; height: 4px; margin-top: 16px; background: var(--red); }
  #ozc .ozf-intro { margin: 0 0 26px; font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 300; font-size: 20px; line-height: 1.45; color: #ffe8ea; }
  #ozc .ozf-loading { font-size: 15px; color: #bdb4b5; }
  #ozc .ozf-form { padding-top: 4px; }
  #ozc .ozf-f { margin-bottom: 20px; }
  #ozc .ozf-l { color: #ffd9dd; }
  #ozc .ozf-help { color: #cfc4c5; }
  #ozc .ozf-in { border-color: rgba(255,255,255,.6); }
  #ozc .ozf-in:focus { outline-color: var(--red); border-color: var(--red); }
  #ozc .ozf-in[aria-invalid="true"] { border-color: var(--soft); }
  #ozc fieldset.ozf-f[aria-invalid="true"] { padding-left: 10px; border-left: 3px solid var(--soft); }
  #ozc .ozf-opt { color: #fff; font-size: 16px; }
  #ozc .ozf-err, #ozc .ozf-status { color: var(--soft); }
  #ozc .ozf-btn { padding: 13px 22px; font-weight: 600; }
  #ozc .ozf-btn:hover, #ozc .ozf-btn:focus-visible { background: #fff; border-color: #fff; color: #0a0506; outline: 2px solid var(--red); }
  #ozc .ozf-b2 { background: transparent; color: #fff; border-color: rgba(255,255,255,.6); }
  #ozc .ozf-ok { padding: 16px 18px; border-left: 4px solid var(--red); background: rgba(255,255,255,.06); color: #fff; font-size: 17px; }
  #ozc .ozf-ok:focus { outline: 2px solid var(--red); outline-offset: 2px; }
  #ozc .ozf-fallback p { margin: 0 0 8px; font-size: 16px; line-height: 1.5; color: #f1e8e9; }
  #ozc .ozf-mail { color: #fff; }
  #ozc .ozf-privacy { margin-top: 22px; color: #bdb4b5; }
  #ozc .ozf-privacy a { color: var(--soft); }
  #ozc .ozf-privacy a:hover, #ozc .ozf-privacy a:focus-visible { color: #fff; }
  #ozc .oc-off { margin: 0; font-size: 16px; line-height: 1.5; color: #f1e8e9; }
  #ozc .oc-off span { font-weight: 600; color: #fff; user-select: all; word-break: break-all; }

  @media (max-width: 760px) {
    #ozc { padding: 28px 18px 26px; }
    #ozc .ozf-h { font-size: 40px; }
    #ozc .ozf-intro { font-size: 18px; }
  }
</style>
<div id="ozc"></div>
<script src="https://dcvizcayno.github.io/danyeloz-embeds/forms-core.js"></script>
<script>
(function () {
  // ---- Settings ----
  var FORM_KEY = 'contact';
  var EMAIL = 'daniel.vizkaino@gmail.com';

  var root = document.getElementById('ozc');
  if (window.OZForms && typeof window.OZForms.render === 'function') {
    window.OZForms.render(root, FORM_KEY);
    return;
  }
  // forms-core.js did not load: show the email address as text.
  var p = document.createElement('p'), mail = document.createElement('span');
  p.className = 'oc-off';
  p.textContent = 'The form is not available right now. Please email me at ';
  mail.textContent = EMAIL;
  p.appendChild(mail);
  root.appendChild(p);
})();
</script>
</body>
</html>
