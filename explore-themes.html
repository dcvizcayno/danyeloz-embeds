<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Danyel OZ: Explore by Theme</title>
</head>
<body>
<!-- Danyel OZ: Explore by Theme (Singles page)
     Google Sites: Insert > Embed > By URL: https://dcvizcayno.github.io/danyeloz-embeds/explore-themes.html
     Up to 5 themes from the admin app (Singles Page > Themes). Each song shows under its Theme 1 and Theme 2.
     A play button opens a small Bandcamp player right under the song. Add ?theme=Heartbreak to open on a theme. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600&family=Great+Vibes&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  #et { --red: #e3122a; --deep: #b0101f; font-family: 'Oswald', 'Arial Narrow', sans-serif; color: #111; box-sizing: border-box;
    height: 100vh; display: flex; flex-direction: column; padding: 4px 6px 8px; }
  #et * { box-sizing: border-box; }
  #et button { font-family: inherit; color: inherit; cursor: pointer; }

  /* ---- theme tiles ---- */
  .et-themes { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(150px, 1fr)); gap: 8px; flex: none; margin-bottom: 14px;
    overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 4px; scrollbar-width: thin; }
  .et-theme { position: relative; overflow: hidden; text-align: left; background: #0a0a0a; color: #fff !important; border: 0; border-radius: 4px;
    padding: 14px 14px 13px; min-height: 118px; display: flex; flex-direction: column; justify-content: flex-end; scroll-snap-align: start;
    transition: transform .2s cubic-bezier(.16,1,.3,1), background .2s; }
  .et-theme::before { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 90% at 100% 0%, rgba(227,18,42,.45), transparent 60%); }
  .et-theme > * { position: relative; }
  .et-theme:hover { transform: translateY(-3px); }
  .et-theme[aria-selected="true"] { background: var(--red); }
  .et-theme[aria-selected="true"]::before { background: radial-gradient(120% 90% at 100% 0%, rgba(0,0,0,.25), transparent 60%); }
  .et-theme:focus-visible { outline: 3px solid #111; outline-offset: 2px; }
  .et-theme .n { position: absolute; top: 10px; right: 12px; font-size: 12px; letter-spacing: 3px; opacity: .8; }
  .et-theme .t { font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 24px; line-height: 1; letter-spacing: .5px; text-transform: uppercase; }
  .et-theme .s { font-family: 'Great Vibes', cursive; font-size: 21px; line-height: 1.1; color: #ffd2d6; margin-top: 4px; }
  .et-theme[aria-selected="true"] .s { color: #fff; }
  .et-theme .c { font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; opacity: .85; margin-top: 6px; }

  /* ---- songs ---- */
  .et-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex: none; border-bottom: 2px solid #111; padding-bottom: 8px; }
  .et-head h2 { margin: 0; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 30px; letter-spacing: .5px; text-transform: uppercase; }
  .et-head span { font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--deep); }
  .et-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; padding-right: 4px; }
  .et-song { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 4px 14px; padding: 16px 2px; border-bottom: 1px solid #ece7e7; }
  .et-play { grid-row: 1 / span 2; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--red); color: #fff !important;
    display: inline-flex; align-items: center; justify-content: center; transition: transform .15s, background .2s; margin-top: 2px; }
  .et-play:hover { transform: scale(1.06); background: var(--deep); }
  .et-play:focus-visible { outline: 3px solid #111; outline-offset: 2px; }
  .et-play svg { width: 16px; height: 16px; fill: currentColor; }
  .et-play[aria-expanded="true"] { background: #111; }
  .et-noplay { grid-row: 1 / span 2; width: 44px; height: 44px; border-radius: 50%; border: 1px dashed #cfc6c6; }
  .et-title { margin: 0; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 24px; line-height: 1.05; letter-spacing: .5px;
    text-transform: uppercase; overflow-wrap: anywhere; }
  .et-title small { font-family: 'Oswald', sans-serif; font-size: 11.5px; letter-spacing: 2.5px; color: var(--deep); margin-left: 10px; vertical-align: 3px; white-space: nowrap; }
  .et-body { grid-column: 2 / -1; min-width: 0; }
  .et-excerpt { font-family: 'Open Sans', Arial, sans-serif; font-size: 15px; line-height: 1.65; color: #333; margin: 4px 0 6px; }
  .et-story p { font-family: 'Open Sans', Arial, sans-serif; font-size: 15px; line-height: 1.7; color: #222; margin: 0 0 12px; }
  .et-more { background: none; border: 0; border-bottom: 2px solid var(--red); padding: 0 0 2px; font-size: 12px; font-weight: 500;
    letter-spacing: 2.5px; text-transform: uppercase; color: var(--deep) !important; }
  .et-more:hover { color: var(--red) !important; }
  .et-player { overflow: hidden; max-height: 0; transition: max-height .35s ease; }
  .et-player.on { max-height: 140px; }
  .et-player iframe { display: block; width: 100%; max-width: 640px; height: 120px; border: 0; background: #000; border-radius: 4px; margin: 8px 0 6px; }
  .et-side { grid-row: 1; grid-column: 3; display: flex; align-items: flex-start; }
  .et-showmore { display: block; margin: 18px auto 8px; background: #0a0a0a; color: #fff !important; border: 0; padding: 11px 22px;
    font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; }
  .et-showmore:hover { background: var(--red); }
  .et-msg { font-size: 16px; color: #555; padding: 28px 4px; }

  /* share, same look as Featured Singles */
  .fs-share { position: relative; }
  .fs-share > button { display: inline-flex; align-items: center; gap: 7px; background: none; border: 1px solid #111; padding: 7px 11px;
    font-size: 12px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; }
  .fs-share > button:hover, .fs-share > button[aria-expanded="true"] { background: #111; color: #fff !important; }
  .fs-share svg { width: 13px; height: 13px; fill: currentColor; }
  .fs-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 200px; background: #0a0a0a; color: #fff;
    padding: 6px; box-shadow: 0 18px 40px rgba(0,0,0,.35); border-top: 3px solid var(--red); }
  .fs-menu[hidden] { display: none; }
  .fs-menu a, .fs-menu button { display: block; width: 100%; text-align: left; background: none; border: 0; color: #fff !important; text-decoration: none;
    font-size: 12.5px; letter-spacing: 2px; text-transform: uppercase; padding: 9px 12px; }
  .fs-menu a:hover, .fs-menu button:hover, .fs-menu a:focus-visible, .fs-menu button:focus-visible { background: var(--red); outline: none; }
  .fs-menu input { width: 100%; margin: 4px 0 2px; padding: 8px; font: 12px 'Open Sans', sans-serif; border: 0; }

  @media (max-width: 760px) {
    #et { height: auto; min-height: 100vh; }
    .et-themes { grid-template-columns: repeat(var(--n, 5), 70%); }
    .et-theme { min-height: 100px; }
    .et-list { overflow: visible; }
    .et-song { grid-template-columns: 44px minmax(0, 1fr); }
    .et-body { grid-row: 2; }
    .et-side { grid-column: 2; grid-row: 3; margin-top: 4px; }
    .et-title { font-size: 21px; }
    .et-head h2 { font-size: 24px; }
  }
</style>

<div id="et"><p class="et-msg">Loading…</p></div>

<script>
(function () {
  /* ================= Settings ================= */
  var PAGE_SIZE  = 12;                 // songs shown before "Show more songs"
  var READ_MORE  = 'Read more';
  var READ_LESS  = 'Show less';
  var PAGE_URL   = 'https://www.danyeloz.info/released/singles-original-songs-releases';  // shared when a song has no Bandcamp page
  var EMPTY_TEXT = 'Songs for this theme are on the way.';
  /* ============================================ */

  var SHEET_ID = '1WD98RYgWPURqwtczPYEblCOOPFutAIO1jf42oSfbzPw';
  var BASE = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv';
  var TIME_ZONE = 'Asia/Singapore';
  var root = document.getElementById('et');
  var wanted = new URLSearchParams(location.search).get('theme') || '';

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function norm(s) { return String(s || '').toLowerCase().replace(/[’']/g, "'").replace(/\s+/g, ' ').trim(); }
  function parseCSV(t) {
    var rows = [], row = [], cur = '', inq = false;
    for (var i = 0; i < t.length; i++) {
      var c = t[i];
      if (inq) { if (c === '"' && t[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') inq = false; else cur += c; }
      else if (c === '"') inq = true; else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    var head = (rows.shift() || []).map(function (h) { return h.trim().toLowerCase(); });
    return { head: head, rows: rows.filter(function (r) { return r.some(function (v) { return v.trim(); }); }).map(function (r) {
      var o = {}; head.forEach(function (h, k) { o[h] = (r[k] || '').trim(); }); return o; }) };
  }
  function get(url) { return fetch(url).then(function (r) { return r.ok ? r.text() : ''; }).then(parseCSV).catch(function () { return { head: [], rows: [] }; }); }
  function today() { return new Intl.DateTimeFormat('en-CA', { timeZone: TIME_ZONE }).format(new Date()); }
  function isoDate(v) { var m = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : ''; }
  function niceDate(iso) {
    var p = iso.split('-').map(Number);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2])).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  }
  function firstSentence(t) {
    t = String(t || '').replace(/\s+/g, ' ').trim();
    var m = t.match(/^.{20,220}?[.!?](?=\s|$)/);
    return m ? m[0] : (t.length > 200 ? t.slice(0, 200).replace(/\s+\S*$/, '') + '…' : t);
  }
  /* A compact Bandcamp player (small cover, 120px tall), recolored to the site theme. */
  function compactPlayer(code) {
    var m = String(code || '').match(/src\s*=\s*["']https:\/\/bandcamp\.com\/EmbeddedPlayer\/((?:album|track)=\d+)/i);
    return m ? 'https://bandcamp.com/EmbeddedPlayer/' + m[1] + '/size=large/bgcol=000000/linkcol=e3122a/tracklist=false/artwork=small/transparent=true/' : '';
  }
  function bandcampPage(code) {
    var m = String(code || '').match(/href\s*=\s*["'](https:\/\/[a-z0-9-]+\.bandcamp\.com\/[^"'\s<>]+)["']/i);
    return m ? m[1] : '';
  }
  var PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>';
  var STOP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>';

  /* ---------- share menu ---------- */
  var openMenu = null;
  function closeMenus() { if (openMenu) { openMenu.menu.hidden = true; openMenu.btn.setAttribute('aria-expanded', 'false'); openMenu = null; } }
  document.addEventListener('click', function (e) { if (openMenu && !openMenu.wrap.contains(e.target)) closeMenus(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenus(); });
  function shareMenu(song) {
    var url = bandcampPage(song.bandcamp_embed) || PAGE_URL;
    var text = '"' + song.song_title + '" by Danyel OZ';
    var wrap = el('div', 'fs-share'), btn = el('button');
    btn.type = 'button'; btn.setAttribute('aria-haspopup', 'true'); btn.setAttribute('aria-expanded', 'false');
    btn.setAttribute('aria-label', 'Share ' + song.song_title);
    btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16a3 3 0 0 0-2.4 1.2l-6.8-3.4a3 3 0 0 0 0-1.6l6.8-3.4A3 3 0 1 0 15 7c0 .3 0 .5.1.8L8.3 11.2a3 3 0 1 0 0 3.6l6.8 3.4A3 3 0 1 0 18 16z"/></svg>';
    btn.appendChild(document.createTextNode('Share'));
    var menu = el('div', 'fs-menu'); menu.hidden = true; menu.setAttribute('role', 'menu');
    var e = encodeURIComponent;
    [['X', 'https://x.com/intent/post?text=' + e(text) + '&url=' + e(url)],
     ['Facebook', 'https://www.facebook.com/sharer/sharer.php?u=' + e(url)],
     ['WhatsApp', 'https://wa.me/?text=' + e(text + ' ' + url)],
     ['Threads', 'https://www.threads.net/intent/post?text=' + e(text + ' ' + url)],
     ['Telegram', 'https://t.me/share/url?url=' + e(url) + '&text=' + e(text)]].forEach(function (p) {
      var a = el('a', null, p[0]); a.href = p[1]; a.target = '_blank'; a.rel = 'noopener'; a.setAttribute('role', 'menuitem');
      a.addEventListener('click', closeMenus); menu.appendChild(a);
    });
    var copy = el('button', null, 'Copy link'); copy.type = 'button'; copy.setAttribute('role', 'menuitem');
    copy.addEventListener('click', function () {
      function shown() {
        if (menu.querySelector('input')) return;
        var inp = el('input'); inp.value = url; inp.readOnly = true; inp.setAttribute('aria-label', 'Link to copy');
        menu.appendChild(inp); inp.focus(); inp.select(); copy.textContent = 'Select and copy';
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { copy.textContent = 'Copied'; setTimeout(function () { copy.textContent = 'Copy link'; }, 1600); }, shown);
      } else shown();
    });
    menu.appendChild(copy);
    if (navigator.share) {
      var more = el('button', null, 'More apps…'); more.type = 'button'; more.setAttribute('role', 'menuitem');
      more.addEventListener('click', function () { navigator.share({ title: song.song_title, text: text, url: url }).catch(function () {}); closeMenus(); });
      menu.appendChild(more);
    }
    btn.addEventListener('click', function (ev) {
      ev.stopPropagation();
      var was = openMenu && openMenu.menu === menu; closeMenus();
      if (!was) { menu.hidden = false; btn.setAttribute('aria-expanded', 'true'); openMenu = { menu: menu, btn: btn, wrap: wrap }; }
    });
    wrap.appendChild(btn); wrap.appendChild(menu);
    return wrap;
  }

  /* ---------- one song row ---------- */
  var playing = null;   // only one small player open at a time
  function songRow(s) {
    var row = el('article', 'et-song');
    var src = compactPlayer(s.bandcamp_embed);
    var holder = el('div', 'et-player');
    if (src) {
      var play = el('button', 'et-play'); play.type = 'button'; play.innerHTML = PLAY;
      play.setAttribute('aria-label', 'Play ' + s.song_title); play.setAttribute('aria-expanded', 'false');
      play.addEventListener('click', function () {
        var open = play.getAttribute('aria-expanded') === 'true';
        if (playing && playing.btn !== play) stop(playing);
        if (open) { stop({ btn: play, holder: holder }); return; }
        var f = el('iframe'); f.src = src; f.title = s.song_title + ' on Bandcamp'; f.setAttribute('seamless', ''); f.setAttribute('allow', 'autoplay');
        holder.innerHTML = ''; holder.appendChild(f);
        requestAnimationFrame(function () { holder.classList.add('on'); });
        play.innerHTML = STOP; play.setAttribute('aria-expanded', 'true'); play.setAttribute('aria-label', 'Close player for ' + s.song_title);
        playing = { btn: play, holder: holder, name: s.song_title };
      });
      row.appendChild(play);
    } else {
      var none = el('span', 'et-noplay'); none.title = 'Not on Bandcamp yet'; row.appendChild(none);
    }
    var title = el('h3', 'et-title', s.song_title);
    var iso = isoDate(s.release_date);
    if (iso) title.appendChild(el('small', null, iso > today() ? 'OUT ' + niceDate(iso).toUpperCase() : iso.slice(0, 4)));
    row.appendChild(title);
    var side = el('div', 'et-side'); side.appendChild(shareMenu(s)); row.appendChild(side);

    var body = el('div', 'et-body');
    var paras = String(s.song_description || '').split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean);
    if (paras.length) {
      var ex = firstSentence(paras[0]);
      var excerpt = el('p', 'et-excerpt', ex);
      body.appendChild(excerpt);
      var full = paras.join('\n\n').replace(/\s+/g, ' ').trim();
      if (full.length > ex.length + 2) {
        var story = el('div', 'et-story'); story.hidden = true;
        paras.forEach(function (p) {
          var para = el('p');
          p.split('\n').forEach(function (line, k) { if (k) para.appendChild(el('br')); para.appendChild(document.createTextNode(line)); });
          story.appendChild(para);
        });
        body.appendChild(story);
        var more = el('button', 'et-more', READ_MORE); more.type = 'button'; more.setAttribute('aria-expanded', 'false');
        more.addEventListener('click', function () {
          var opening = story.hidden;
          story.hidden = !opening; excerpt.hidden = opening;
          more.textContent = opening ? READ_LESS : READ_MORE; more.setAttribute('aria-expanded', String(opening));
          if (!opening) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        });
        body.appendChild(more);
      }
    }
    body.appendChild(holder);
    row.appendChild(body);
    return row;
  }
  function stop(p) {
    p.holder.classList.remove('on');
    setTimeout(function () { if (!p.holder.classList.contains('on')) p.holder.innerHTML = ''; }, 360);
    p.btn.innerHTML = PLAY; p.btn.setAttribute('aria-expanded', 'false');
    if (playing && playing.btn === p.btn) playing = null;
  }

  /* ---------- page ---------- */
  function render(themes, songs) {
    root.innerHTML = '';
    var grid = el('div', 'et-themes'); grid.setAttribute('role', 'tablist'); grid.setAttribute('aria-label', 'Themes');
    grid.style.setProperty('--n', themes.length);
    var head = el('div', 'et-head'), h2 = el('h2'), count = el('span');
    head.appendChild(h2); head.appendChild(count);
    var list = el('div', 'et-list'); list.setAttribute('role', 'tabpanel');
    var tiles = themes.map(function (t, i) {
      var b = el('button', 'et-theme'); b.type = 'button'; b.setAttribute('role', 'tab');
      b.appendChild(el('span', 'n', String(i + 1).padStart(2, '0')));
      b.appendChild(el('span', 't', t.theme));
      if (t.tagline) b.appendChild(el('span', 's', t.tagline));
      b.appendChild(el('span', 'c', t.songs.length + (t.songs.length === 1 ? ' song' : ' songs')));
      b.addEventListener('click', function () { show(i); });
      grid.appendChild(b); return b;
    });
    var at = -1;
    function show(i) {
      if (i === at) return; at = i; closeMenus(); playing = null;
      tiles.forEach(function (b, k) { b.setAttribute('aria-selected', String(k === i)); b.tabIndex = k === i ? 0 : -1; });
      tiles[i].scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
      var t = themes[i];
      h2.textContent = t.theme;
      count.textContent = t.songs.length + (t.songs.length === 1 ? ' song' : ' songs');
      list.innerHTML = ''; list.scrollTop = 0;
      if (!t.songs.length) { list.appendChild(el('p', 'et-msg', EMPTY_TEXT)); return; }
      var shown = 0;
      function more() {
        var btn = list.querySelector('.et-showmore'); if (btn) btn.remove();
        t.songs.slice(shown, shown + PAGE_SIZE).forEach(function (s) { list.appendChild(songRow(s)); });
        shown += PAGE_SIZE;
        if (shown < t.songs.length) {
          var b = el('button', 'et-showmore', 'Show more songs (' + (t.songs.length - shown) + ')'); b.type = 'button';
          b.addEventListener('click', more); list.appendChild(b);
        }
      }
      more();
    }
    grid.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { show((at + 1) % themes.length); tiles[at].focus(); e.preventDefault(); }
      if (e.key === 'ArrowLeft') { show((at - 1 + themes.length) % themes.length); tiles[at].focus(); e.preventDefault(); }
    });
    root.appendChild(grid); root.appendChild(head); root.appendChild(list);
    var start = themes.map(function (t) { return norm(t.theme); }).indexOf(norm(wanted));
    show(start >= 0 ? start : 0);
  }

  Promise.all([get(BASE + '&gid=0'), get(BASE + '&sheet=themes')]).then(function (res) {
    var songs = res[0].rows.filter(function (s) { return s.song_title && /^\s*single\s*$/i.test(s.release_type || 'Single'); });   // singles only
    var raw = res[1].head.indexOf('theme') >= 0 ? res[1].rows : [];
    var themes = raw.filter(function (t) { return t.theme && !/^(false|no|0|hide|hidden)$/i.test(t.visible || ''); })
      .sort(function (a, b) { return (Number(a.slot) || 99) - (Number(b.slot) || 99); }).slice(0, 5)
      .map(function (t) {
        var key = norm(t.theme);
        return { theme: t.theme, tagline: t.tagline || '', songs: songs.filter(function (s) {
          return norm(s.song_theme_1) === key || norm(s.song_theme_2) === key;
        }).sort(function (a, b) { return isoDate(b.release_date).localeCompare(isoDate(a.release_date)); }) };
      });
    if (!themes.length) { root.innerHTML = ''; root.appendChild(el('p', 'et-msg', 'Themes are on the way. Check back soon.')); return; }
    render(themes, songs);
  });
})();
</script>
</body>
</html>
