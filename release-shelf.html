<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Danyel OZ: Release Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<!-- Danyel OZ: Release shelf (Released page)
     A swipeable row of releases from the Song Database, newest first.
     Embed in Google Sites with Insert > Embed > By URL:
       https://dcvizcayno.github.io/danyeloz-embeds/release-shelf.html?type=Single
     ?type= can be Single, EP or Album (matches the release_type column), or Holiday (holiday music of any type).
     ?count= sets how many to show.
     Releases with a Bandcamp code in the sheet (bandcamp_embed) show a play badge and play full songs
     right in the shelf; the others open their streaming link in a new tab. -->
<style>
  html, body { margin: 0; padding: 0; background: #050505; height: 100%; }
  #rs { font-family: 'Plus Jakarta Sans', Arial, sans-serif; color: #f4f4f6; background: #050505;
    border-radius: 16px; padding: 16px 0 14px 16px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; }
  #rs * { box-sizing: border-box; }
  .rs-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-right: 16px; margin: 0 0 12px; }
  .rs-title { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 18px; margin: 0; }
  .rs-hint { font-size: 12px; color: #a1a1aa; margin: 0; white-space: nowrap; }
  .rs-row { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 16px 6px 0;
    scrollbar-width: thin; scrollbar-color: #3f3f46 transparent; flex: 1; min-height: 0; }
  .rs-item { flex: 0 0 var(--w, 150px); scroll-snap-align: start; text-decoration: none; color: inherit; }
  .rs-item:focus-visible { outline: 2px solid #f26b6b; outline-offset: 3px; border-radius: 10px; }
  .rs-cover { width: 100%; aspect-ratio: 1; border-radius: 10px; background: #18181b; overflow: hidden; position: relative; }
  .rs-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rs-cover .rs-alt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 10px;
    text-align: center; font-family: 'Outfit', sans-serif; font-size: 15px; color: #d4d4d8; }
  .rs-new { position: absolute; top: 8px; left: 8px; background: #D3413F; color: #fff; font-size: 10px; font-weight: 600;
    letter-spacing: .06em; padding: 3px 7px; border-radius: 6px; }
  .rs-name { margin: 8px 0 2px; font-weight: 600; font-size: 14px; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rs-meta { margin: 0; font-size: 12px; color: #a1a1aa; }
  .rs-msg { font-size: 14px; color: #c4c4cc; margin: 4px 16px 0 0; line-height: 1.5; }
  .rs-msg a { color: #f26b6b; font-weight: 600; }
  button.rs-item { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; align-self: flex-start; display: block; }
  .rs-row { align-items: flex-start; }
  .rs-name, .rs-meta { display: block; }
  .rs-name { display: -webkit-box; }
  .rs-play { position: absolute; right: 8px; bottom: 8px; width: 30px; height: 30px; border-radius: 50%; background: rgba(5,5,5,.72);
    display: flex; align-items: center; justify-content: center; }
  .rs-play svg { width: 12px; height: 12px; fill: #fff; margin-left: 2px; }
  .rs-now { display: none; flex-direction: column; gap: 10px; flex: 1; min-height: 0; padding-right: 16px; }
  .rs-back { align-self: flex-start; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16);
    background: #111115; color: #e4e4e7; font: 500 13px 'Plus Jakarta Sans', Arial, sans-serif; cursor: pointer; }
  .rs-back:focus-visible { outline: 2px solid #f26b6b; outline-offset: 2px; }
  .rs-now iframe { border: 0; width: 100%; border-radius: 10px; background: #050505; display: block; }
  .rs-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; flex: 1; min-height: 0; }
  .rs-col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .rs-desc { min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #3f3f46 transparent; padding-right: 6px; }
  .rs-desc-title { margin: 0 0 6px; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 16px; }
  .rs-desc p { margin: 0 0 10px; font-size: 13px; line-height: 1.6; color: #d4d4d8; }
  .rs-desc .rs-genre { margin: 0 0 8px; font-size: 12px; color: #a1a1aa; }
  .rs-col iframe { flex: none; }
  @media (max-width: 560px) {   /* phones: player on top, story underneath, the whole view scrolls */
    .rs-split { display: flex; flex-direction: column; overflow-y: auto; gap: 14px; }
    .rs-col, .rs-desc { flex: none; overflow: visible; }
    .rs-col iframe { flex: none !important; height: 120px; }
    .rs-col iframe.rs-album { height: 220px; }
  }
  .rs-note { margin: 0; font-size: 12px; color: #a1a1aa; }
  .rs-note a { color: #f26b6b; font-weight: 600; text-decoration: none; }
</style>

<div id="rs">
  <div class="rs-head"><p class="rs-title" id="rs-title"></p><p class="rs-hint" id="rs-hint"></p></div>
  <div class="rs-row" id="rs-row"><p class="rs-msg">Loading…</p></div>
  <div class="rs-now" id="rs-now"></div>
</div>

<script>
(function () {
  /* ================= Settings ================= */
  var TYPE      = 'Single';   // Single, EP, Album (the release_type column) or Holiday. The URL ?type= overrides this.
  var HOLIDAY_WORDS = /christmas|holiday|xmas|navidad/i;   // Holiday shelf: a title with one of these, or genre "Holiday"
  var COUNT     = 12;         // how many releases to show. The URL ?count= overrides this.
  var TITLE     = 'auto';     // 'auto' = "Newest singles" / "Newest EPs" / "Newest albums", any text, or '' to hide
  var NEW_DAYS  = 14;         // NEW badge for this many days after release (0 = never)
  var LINK_TO   = ['appl_music_link', 'spotify_link', 'yt_video_link', 'amazon_link'];  // no Bandcamp code: first valid one opens in a new tab
  var BC_BG     = '050505';   // Bandcamp player background (hex, no #)
  var BC_LINK   = 'f26b6b';   // Bandcamp player accent color (hex, no #)
  /* ============================================ */

  var ARTIST_ID  = '1706653995';
  var STOREFRONT = 'us';
  var SHEET_ID   = '1WD98RYgWPURqwtczPYEblCOOPFutAIO1jf42oSfbzPw';
  var SHEET_CSV  = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&gid=0';
  var ARTIST_URL = 'https://music.apple.com/us/artist/danyel-oz/1706653995';
  var OK = {
    appl_music_link: /^https:\/\/(music|geo\.music|itunes)\.apple\.com\//i,
    spotify_link:    /^https:\/\/(open\.spotify\.com|spotify\.link)\//i,
    yt_video_link:   /^https:\/\/(www\.|m\.|music\.)?(youtube\.com|youtu\.be)\//i,
    amazon_link:     /^https:\/\/(music\.)?amazon\.[a-z.]+\/|^https:\/\/amzn\.to\//i
  };
  var ART_OK = /^https:\/\/is\d*-ssl\.mzstatic\.com\//i;

  var q = new URLSearchParams(location.search);
  var types = { single: 'Single', ep: 'EP', album: 'Album', holiday: 'Holiday' };
  TYPE  = types[String(q.get('type') || TYPE).toLowerCase()] || 'Single';
  COUNT = Math.max(1, Math.min(50, parseInt(q.get('count'), 10) || COUNT));
  var plural = { Single: 'singles', EP: 'EPs', Album: 'albums', Holiday: 'holiday music' }[TYPE];
  var KINDS = { single: 'Single', ep: 'EP', album: 'Album' };
  /* Does this sheet row belong on this shelf? Holiday takes any release type. */
  function fits(r) {
    if (TYPE === 'Holiday') return !!KINDS[String(r.release_type || '').toLowerCase()] &&
      (/^holiday$/i.test(r.song_genre || '') || HOLIDAY_WORDS.test(r.song_title || ''));
    return String(r.release_type || '').toLowerCase() === TYPE.toLowerCase();
  }
  function kindOf(r) { return KINDS[String(r.release_type || '').toLowerCase()] || TYPE; }

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function norm(s) { return String(s || '').toLowerCase().replace(/ - (single|ep)$/, '').replace(/[’']/g, "'").replace(/\s+/g, ' ').trim(); }
  function parseCSV(t) {
    var rows = [], row = [], cur = '', inq = false;
    for (var i = 0; i < t.length; i++) {
      var c = t[i];
      if (inq) { if (c === '"' && t[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') inq = false; else cur += c; }
      else if (c === '"') inq = true; else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    var head = (rows.shift() || []).map(function (h) { return h.trim().toLowerCase(); });
    return rows.filter(function (r) { return r.join('').trim(); }).map(function (r) {
      var o = {}; head.forEach(function (h, k) { o[h] = (r[k] || '').trim(); }); return o;
    });
  }
  /* Cover from the sheet's song_arts Drive link. It is used first; Apple's artwork is the backup (only a checked Drive file id is used). */
  function driveArt(link) {
    var m = String(link || '').match(/^https:\/\/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([\w-]{20,})/i);
    return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w400' : '';
  }
  function appleIdFrom(row) {
    if (/^\d{6,}$/.test(row.song_id || '')) return row.song_id;
    var m = String(row.appl_music_link || '').match(/\/(\d{6,})(?:[?#]|$)/);
    return m ? m[1] : '';
  }

  var title = TITLE === 'auto' ? (TYPE === 'Holiday' ? 'Holiday music' : 'Newest ' + plural) : TITLE;
  $('rs-title').textContent = title;
  if (!title) $('rs-title').style.display = 'none';

  var appleReq = fetch('https://itunes.apple.com/lookup?id=' + ARTIST_ID + '&entity=album&sort=recent&limit=200&country=' + STOREFRONT)
    .then(function (r) { return r.json(); }).catch(function () { return {}; });
  var sheetReq = fetch(SHEET_CSV).then(function (r) { return r.text(); }).then(parseCSV);

  Promise.all([appleReq, sheetReq]).then(function (res) {
    var first = res;
    /* Apple's artist lookup sometimes leaves out the newest releases for a few days: look those up by their own id. */
    var ids0 = {};
    (res[0].results || []).forEach(function (x) { if (x.wrapperType === 'collection') ids0[String(x.collectionId)] = true; });
    var miss = [];
    res[1].forEach(function (r) {
      if (!fits(r)) return;
      var id = appleIdFrom(r); if (id && !ids0[id] && miss.indexOf(id) < 0) miss.push(id);
    });
    if (!miss.length) return first;
    return fetch('https://itunes.apple.com/lookup?id=' + miss.slice(0, 150).join(',') + '&country=' + STOREFRONT)
      .then(function (r) { return r.json(); }).catch(function () { return {}; })
      .then(function (extra) { first[0] = { results: (first[0].results || []).concat(extra.results || []) }; return first; });
  }).then(function (res) {
    var byId = {}, byName = {};
    (res[0].results || []).forEach(function (x) {
      if (x.wrapperType === 'track' && x.trackId) { byId[String(x.trackId)] = x; return; }   // song_id was a track id
      if (x.wrapperType !== 'collection') return;
      byId[String(x.collectionId)] = x; byName[norm(x.collectionName)] = x;
    });

    var today = new Date(); today.setHours(23, 59, 59, 999);
    var seen = {}, list = [];
    res[1].forEach(function (r) {
      if (!fits(r)) return;
      var d = r.release_date ? new Date(r.release_date + 'T00:00:00') : null;
      if (!d || isNaN(d) || d > today) return;                 // released only; upcoming songs live elsewhere
      var id = appleIdFrom(r), key = id || norm(r.song_title); // album tracks share one collection id
      if (!key || seen[key]) return; seen[key] = true;
      list.push({ row: r, id: id, date: d });
    });
    list.sort(function (a, b) { return b.date - a.date; });
    var total = list.length;
    list = list.slice(0, COUNT);
    if (!list.length) throw new Error('empty');

    $('rs-hint').textContent = total > list.length ? 'Swipe for more' : '';
    var row = $('rs-row'); row.textContent = '';
    list.forEach(function (it) {
      var r = it.row, apple = byId[it.id] || byName[norm(r.song_title)];
      var name = kindOf(r) === 'Album' && apple ? apple.collectionName : r.song_title;

      var url = '';
      for (var k = 0; k < LINK_TO.length && !url; k++) {
        var v = String(r[LINK_TO[k]] || '').trim();
        if (v && OK[LINK_TO[k]] && OK[LINK_TO[k]].test(v)) url = v;
      }
      if (!url && apple && OK.appl_music_link.test(apple.collectionViewUrl || '')) url = apple.collectionViewUrl;
      if (!url) url = ARTIST_URL;

      var bc = bandcamp(r.bandcamp_embed), a;
      if (bc) {                                                  // full songs play right here on Bandcamp
        a = el('button', 'rs-item'); a.type = 'button';
        a.setAttribute('aria-label', 'Play ' + name + ' on Bandcamp');
        a.addEventListener('click', (function (name, bc, btn, row) { return function () { play(name, bc, btn, row); }; })(name, bc, a, r));
      } else {
        a = el('a', 'rs-item'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
        a.setAttribute('aria-label', name + ', opens in a new tab');
      }
      var cover = el('div', 'rs-cover');
      var art = apple && apple.artworkUrl100 ? apple.artworkUrl100.replace(/\/\d+x\d+bb\./, '/400x400bb.') : '';
      if (!(art && ART_OK.test(art))) art = '';
      var drive = driveArt(r.song_arts);
      if (drive) { var appleArt = art; art = drive; drive = appleArt; }  // the Song Database cover always comes first, Apple's is the backup
      if (art) {
        var img = el('img'); img.src = art; img.alt = ''; img.loading = 'lazy';
        img.onerror = (function (img, cover, name, backup) { return function () {
          if (backup && img.src !== backup) { img.src = backup; return; }
          cover.textContent = ''; cover.appendChild(el('span', 'rs-alt', name));
        }; })(img, cover, name, drive);
        cover.appendChild(img);
      } else {
        cover.appendChild(el('span', 'rs-alt', name));         // no artwork: show the title on a dark tile
      }
      var age = (Date.now() - it.date.getTime()) / 86400000;
      if (NEW_DAYS > 0 && age >= 0 && age <= NEW_DAYS) cover.appendChild(el('span', 'rs-new', 'NEW'));
      if (bc) {
        var pb = el('span', 'rs-play'); pb.setAttribute('aria-hidden', 'true');
        pb.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z"/></svg>';
        cover.appendChild(pb);
      }
      a.appendChild(cover);
      a.appendChild(el('span', 'rs-name', name));
      a.appendChild(el('span', 'rs-meta', it.date.getFullYear() + ' · ' + kindOf(r)));
      row.appendChild(a);
    });
    fit();
  }).catch(function () {
    var row = $('rs-row'); row.textContent = '';
    var p = el('p', 'rs-msg', 'The ' + plural + ' are taking a moment to load. ');
    var a = el('a', null, 'Listen on Apple Music'); a.href = ARTIST_URL; a.target = '_blank'; a.rel = 'noopener';
    p.appendChild(a); row.appendChild(p);
    $('rs-hint').textContent = '';
  });

  /* Reads Bandcamp's embed code and keeps only the album or track number (never runs the pasted HTML).
     The player address is rebuilt in the shelf's dark colors, with a track list for albums and EPs.
     Bandcamp plays full songs (with its own free-listen limits). */
  function bandcamp(code) {
    var m = String(code || '').match(/src\s*=\s*["']https:\/\/bandcamp\.com\/EmbeddedPlayer\/[\w=\/.-]*?\b(album|track)=(\d+)/i);
    if (!m) return null;
    var isAlbum = m[1].toLowerCase() === 'album';
    var page = (String(code).match(/href\s*=\s*["'](https:\/\/[\w-]+\.bandcamp\.com\/[\w\/.-]+)["']/i) || [])[1] || '';
    return {
      album: isAlbum, page: page,
      src: 'https://bandcamp.com/EmbeddedPlayer/' + m[1].toLowerCase() + '=' + m[2] + '/size=large/bgcol=' + BC_BG +
           '/linkcol=' + BC_LINK + '/artwork=small/tracklist=' + (isAlbum ? 'true' : 'false') + '/transparent=true/'
    };
  }

  /* "Now playing": the shelf row steps aside for the Bandcamp player, with a Back button. */
  var shelfTitle = '', shelfHint = '', lastBtn = null;
  function play(name, bc, btn, row) {
    lastBtn = btn; shelfTitle = $('rs-title').textContent; shelfHint = $('rs-hint').textContent;
    $('rs-title').textContent = 'Now playing'; $('rs-hint').textContent = '';
    var now = $('rs-now'); now.textContent = '';
    var back = el('button', 'rs-back', '← Back to ' + plural);
    back.type = 'button'; back.addEventListener('click', stop);
    now.appendChild(back);
    var f = el('iframe');
    f.src = bc.src;                                              // only a rebuilt bandcamp.com player address is ever used
    f.title = 'Listen to ' + name + ' on Bandcamp';
    f.setAttribute('seamless', '');
    if (bc.album) { f.className = 'rs-album'; f.style.flex = '1'; f.style.minHeight = '140px'; } else f.style.height = '120px';
    var split = el('div', 'rs-split'), left = el('div', 'rs-col'), right = el('div', 'rs-desc');
    left.appendChild(f);
    var note = el('p', 'rs-note', 'Full songs on Bandcamp. ');
    if (bc.page) { var a = el('a', null, 'Open on Bandcamp'); a.href = bc.page; a.target = '_blank'; a.rel = 'noopener'; note.appendChild(a); }
    left.appendChild(note);
    /* The song's story from the Song Database (song_description), shown as plain text. */
    right.appendChild(el('p', 'rs-desc-title', name));
    var bits = [row && row.song_genre, row && row.release_date ? fmtDate(row.release_date) : ''].filter(Boolean);
    if (bits.length) right.appendChild(el('p', 'rs-genre', bits.join(' · ')));
    var text = String((row && row.song_description) || '').trim();
    if (text) text.split(/\n\s*\n|\r?\n/).forEach(function (para) { if (para.trim()) right.appendChild(el('p', null, para.trim())); });
    else right.appendChild(el('p', null, 'The story behind this song is coming soon.'));
    split.appendChild(left); split.appendChild(right);
    now.appendChild(split);
    $('rs-row').style.display = 'none'; now.style.display = 'flex';
    back.focus();
  }
  function fmtDate(iso) {
    var d = new Date(iso + 'T00:00:00'); if (isNaN(d)) return '';
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }
  function stop() {
    var now = $('rs-now'); if (now.style.display !== 'flex') return;
    now.style.display = 'none'; now.textContent = '';               // removing the player stops the music
    $('rs-row').style.display = '';
    $('rs-title').textContent = shelfTitle; $('rs-hint').textContent = shelfHint;
    if (lastBtn) lastBtn.focus();
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') stop(); });

  /* Sizes the covers to the embed box, so the row still fits when Google Sites shrinks the box on phones. */
  function fit() {
    var head = document.querySelector('.rs-head').offsetHeight + 12;
    var room = window.innerHeight - 30 - head - 52;             // padding, title, and name + year under each cover
    var w = Math.max(110, Math.min(180, room));
    $('rs').style.setProperty('--w', w + 'px');
  }
  window.addEventListener('resize', fit);
})();
</script>

</body>
</html>
