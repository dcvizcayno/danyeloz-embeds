<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Danyel OZ: Sync One-Sheet</title>
</head>
<body>
<!-- Danyel OZ: Sync one-sheet for music supervisors
     URL: https://dcvizcayno.github.io/danyeloz-embeds/sync-one-sheet.html
     Prints to one A4 or Letter page (browser Print, then Save as PDF). Shown in a frame, the catalogue address is
     plain text and "Request a license" opens an in-page panel (mailto and new-tab chains do not work in Google Sites).
     Rights wording, contact and songs come from the Song Database through sync-core.js (sync_settings tab and the Sync tab in the admin app). Songs: released
     featured songs, newest first, up to 10; fewer than 8 are topped up with the newest complete songs.
     No URL parameter changes anything on this page. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* One-sheet styles (screen and print) come from sync-core.js (OZSync.renderOneSheet). */
  html, body { margin: 0; padding: 0; background: #fff; }
  #os { font-family: 'Open Sans', Arial, sans-serif; color: #111; max-width: 1040px; margin: 0 auto; }
  @page { size: auto; margin: 12mm 12mm 12mm 12mm; }
  @media print { html, body { background: #fff !important; } }
</style>
<div id="os"><p class="os-msg">Loading…</p></div>
<script src="https://dcvizcayno.github.io/danyeloz-embeds/sync-core.js"></script>
<script>
(function () {
  var root = document.getElementById('os');
  // No sync-core.js: plain text only, nothing from data.
  if (!window.OZSync) {
    var p = document.createElement('p');
    p.textContent = 'This page could not load. Please try again later.';
    root.textContent = ''; root.appendChild(p); return;
  }
  var Z = window.OZSync;
  // Top-level tab: the catalogue link stays in this tab. Framed (an embed): plain text, so no tab chain.
  var opts = { catalogue: Z.isTop() ? 'link' : 'text', hint: true };
  Z.load().then(function (res) { Z.renderOneSheet(root, res, opts); },
    function () { Z.renderOneSheet(root, { ok: false, songs: [], settings: Z.settings(null) }, opts); });
})();
</script>
</body>
</html>
