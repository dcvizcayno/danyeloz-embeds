name: X release posts
on:
  schedule:
    - cron: '2 17 * * *'   # about 1 AM Manila, every night (GitHub can start a few minutes late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show what would be posted tonight'
        type: boolean
        default: true
concurrency:
  group: x-log          # never at the same time as another run that writes the log
permissions:
  issues: write
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: run
        run: |
          python3 x-agent/agent.py release | tee out.txt
          grep -q POSTED out.txt && echo "posted=1" >> "$GITHUB_OUTPUT" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - if: steps.run.outputs.posted == '1'
        run: |
          git config user.name "Danyel OZ X agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/x-posts.json
          git commit -m "Log X release post"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
