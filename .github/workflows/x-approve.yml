name: X approve
on:
  issues:
    types: [edited]
concurrency:
  group: x-approve-${{ github.event.issue.number }}
permissions:
  issues: write
  contents: write
jobs:
  handle:
    if: contains(github.event.issue.labels.*.name, 'x-draft') && github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: run
        run: |
          python3 x-agent/agent.py handle | tee out.txt
          grep -q POSTED out.txt && echo "posted=1" >> "$GITHUB_OUTPUT" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - if: steps.run.outputs.posted == '1'
        run: |
          git config user.name "Danyel OZ X agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/x-posts.json
          git commit -m "Log X post"
          git pull --rebase && git push
