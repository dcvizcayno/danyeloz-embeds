<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Danyel OZ: Listen Now: Player</title>
</head>
<body>
<!-- Danyel OZ: Player card (embed 1 of 2)
     Paste into Google Sites: Insert > Embed > Embed code.
     Reusable: change SONG below to show the latest release or any song from your Song Database. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600&family=Great+Vibes&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #ozp { position: relative; overflow: hidden; font-family: 'Oswald', 'Arial Narrow', sans-serif; color: #fff; border-radius: 6px;
    padding: 24px 22px 22px; width: 100%; box-sizing: border-box; border: 1px solid #2a0b0f;
    background: radial-gradient(90% 55% at 0% 0%, rgba(176,16,31,.42), transparent 70%),
                radial-gradient(60% 40% at 100% 100%, rgba(176,16,31,.18), transparent 70%), #050505; }
  #ozp * { box-sizing: border-box; }
  .ozp-label { font-family: 'Great Vibes', cursive; font-size: 34px; line-height: 1; color: #e3122a; margin: 0 0 2px;
    text-transform: none; letter-spacing: 0; }
  .ozp-title { font-family: 'Anton', Impact, sans-serif; font-size: 46px; line-height: .98; letter-spacing: 1px;
    text-transform: uppercase; margin: 0 0 12px; overflow-wrap: anywhere; }
  .ozp-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
  .ozp-date, .ozp-new { display: inline-block; font-size: 12px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase;
    padding: 5px 12px; margin: 0; }
  .ozp-date { border: 1px solid #e3122a; color: #fff; }
  .ozp-date:empty { display: none; }
  .ozp-new { background: #e3122a; color: #fff; border: 1px solid #e3122a; }
  #ozp iframe { display: block; width: 100%; height: 450px; border: 0; border-radius: 4px; background: #000; }
  #ozp iframe.ozp-bc { margin: 0 auto; box-shadow: 0 22px 50px -18px rgba(176,16,31,.45); }
  .ozp-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .ozp-links a { flex: 1 1 120px; text-align: center; text-decoration: none; color: #fff; background: transparent;
    border: 1px solid rgba(255,255,255,.55); border-radius: 2px; font: 500 13px 'Oswald', 'Arial Narrow', sans-serif;
    letter-spacing: 2.5px; text-transform: uppercase; padding: 11px 10px; transition: background .2s, border-color .2s; }
  .ozp-links a:hover, .ozp-links a:focus-visible { background: #e3122a; border-color: #e3122a; outline: none; }
  .ozp-msg { font-size: 14px; color: #ddd; }
  @media (max-width: 480px) {
    #ozp { padding: 16px 14px; }
    .ozp-label { font-size: 28px; }
    .ozp-title { font-size: 34px; }
    .ozp-links a { flex-basis: 45%; padding: 9px 8px; font-size: 12px; letter-spacing: 1.8px; }
  }
</style>

<div id="ozp">
  <p class="ozp-label" id="ozp-label"></p>
  <p class="ozp-title" id="ozp-title">Loading…</p>
  <div class="ozp-tags" id="ozp-tags"><p class="ozp-date" id="ozp-date"></p></div>
  <div id="ozp-player"></div>
  <div class="ozp-links" id="ozp-links"></div>
</div>

<script>
(function () {
  /* ================= Settings ================= */
  var SONG       = 'latest';          // 'latest' = newest release date in your Song Database (switches at midnight Manila),
                                      // or a song title / Apple Music ID from your sheet, e.g. 'Carmen'
  var LABEL      = 'auto';            // 'auto' = "Latest release" or "Featured song". Or any text, or '' to hide
  var NEW_DAYS   = 14;                // show the NEW badge for this many days (0 = never)
  var SHOW_LINKS = true;              // platform buttons under the player
  var PLAYER     = 'bandcamp';        // 'bandcamp' = Bandcamp player (Apple Music if the song has no Bandcamp code)
                                      // 'apple'    = always Apple Music
  /* ============================================ */

  var ARTIST_ID  = '1706653995';      // Danyel OZ on Apple Music
  var STOREFRONT = 'us';
  var SHEET_ID   = '1WD98RYgWPURqwtczPYEblCOOPFutAIO1jf42oSfbzPw';
  var SHEET_CSV  = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&gid=0';
  var ARTIST_LINKS = {
    spotify_link:    { name: 'Spotify',       url: 'https://open.spotify.com/artist/2rXzK2nhFFclSWxkpJ9XYn', ok: /^https:\/\/(open\.spotify\.com|spotify\.link)\//i },
    appl_music_link: { name: 'Apple Music',   url: 'https://music.apple.com/us/artist/danyel-oz/1706653995',  ok: /^https:\/\/(music|geo\.music|itunes)\.apple\.com\//i },
    yt_video_link:   { name: 'YouTube', url: 'https://music.youtube.com/channel/UCmvCshUQAXm1aoWRAnOSTaA', ok: /^https:\/\/(www\.|m\.|music\.)?(youtube\.com|youtu\.be)\//i },
    amazon_link:     { name: 'Amazon Music',  url: 'https://music.amazon.com/artists/B0CHPJX6SM',              ok: /^https:\/\/(music\.)?amazon\.[a-z.]+\/|^https:\/\/amzn\.to\//i }
  };

  function $(id) { return document.getElementById(id); }
  function norm(s) { return String(s || '').toLowerCase().replace(/ - (single|ep)$/, '').replace(/[’']/g, "'").replace(/\s+/g, ' ').trim(); }
  function fmtDate(d) { return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' }); }
  var TIME_ZONE = 'Asia/Singapore';     // Manila and Singapore share this clock
  function todaySG() { return new Intl.DateTimeFormat('en-CA', { timeZone: TIME_ZONE }).format(new Date()); } // YYYY-MM-DD
  function isoDate(v) { var m = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : ''; }
  function dayOf(iso) { var p = iso.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
  /* The newest song in the Song Database whose release date is today or earlier (Manila time).
     Same day: a song with a Bandcamp code wins, then the one higher up in the sheet. */
  function latestRow(rows) {
    var today = todaySG();
    var bc = function (r) { return /bandcamp\.com\/EmbeddedPlayer/i.test(r.bandcamp_embed || '') ? 1 : 0; };
    return rows.map(function (r, i) { return { r: r, i: i, d: isoDate(r.release_date) }; })
      .filter(function (x) { return x.d && x.d <= today && x.r.song_title; })
      .sort(function (a, b) { return b.d.localeCompare(a.d) || bc(b.r) - bc(a.r) || a.i - b.i; })
      .map(function (x) { return x.r; })[0] || null;
  }

  function parseCSV(t) {
    var rows = [], row = [], cur = '', q = false;
    for (var i = 0; i < t.length; i++) {
      var c = t[i];
      if (q) { if (c === '"' && t[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
      else if (c === '"') q = true; else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    var head = (rows.shift() || []).map(function (h) { return h.trim().toLowerCase(); });
    return rows.filter(function (r) { return r.join('').trim(); }).map(function (r) {
      var o = {}; head.forEach(function (h, k) { o[h] = (r[k] || '').trim(); }); return o;
    });
  }
  function appleIdFrom(row) {
    if (/^\d{6,}$/.test(row.song_id || '')) return row.song_id;
    var m = String(row.appl_music_link || '').match(/\/(\d{6,})(?:[?#]|$)/);
    return m ? m[1] : '';
  }

  /* Picks the song from your Song Database: the latest release, or the one named in SONG. */
  function pick(rows) {
    var r2;
    if (String(SONG).toLowerCase() === 'latest') r2 = latestRow(rows);
    else {
      var want = norm(SONG);
      r2 = rows.filter(function (r) { return String(r.song_id) === String(SONG).trim(); })[0] ||
           rows.filter(function (r) { return norm(r.song_title) === want; })[0];
    }
    if (!r2) return null;
    var iso = isoDate(r2.release_date);
    return { id: appleIdFrom(r2), title: r2.song_title, date: iso ? dayOf(iso) : null, appleUrl: r2.appl_music_link, row: r2 };
  }

  var sheetReq = fetch(SHEET_CSV).then(function (r) { return r.text(); }).then(parseCSV).catch(function () { return []; });

  sheetReq.then(function (rows) {
    var s = pick(rows);
    if (!s) throw new Error('Song not found');
    var latest = String(SONG).toLowerCase() === 'latest';

    var label = LABEL === 'auto' ? (latest ? 'Latest release' : 'Featured song') : LABEL;
    $('ozp-label').textContent = label; if (!label) $('ozp-label').style.display = 'none';
    $('ozp-title').textContent = s.title;
    var age = s.date ? (dayOf(todaySG()).getTime() - s.date.getTime()) / 86400000 : null;
    if (age != null && NEW_DAYS > 0 && age >= 0 && age <= NEW_DAYS) {
      var b = document.createElement('span'); b.className = 'ozp-new'; b.textContent = 'NEW'; $('ozp-tags').appendChild(b);
    }
    $('ozp-date').textContent = !s.date ? '' : (age < 0 ? 'Out ' : 'Released ') + fmtDate(s.date);

    var bc = PLAYER === 'bandcamp' ? bandcamp(s.row.bandcamp_embed) : null;
    if (bc) {
      var g = document.createElement('iframe');
      g.src = bc.src;                       // only a checked bandcamp.com player address is ever used
      g.title = 'Listen to ' + s.title + ' on Bandcamp';
      g.setAttribute('seamless', '');
      g.className = 'ozp-bc';
      g.dataset.kind = bc.kind;
      g.dataset.h = bc.height || '';
      $('ozp-player').appendChild(g);
    } else if (s.id) {
      var f = document.createElement('iframe');
      f.allow = 'autoplay *; encrypted-media *; clipboard-write';
      f.sandbox = 'allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation';
      f.src = 'https://embed.music.apple.com/' + STOREFRONT + '/album/' + encodeURIComponent(s.id);
      f.title = 'Listen to ' + s.title;
      $('ozp-player').appendChild(f);
    } else {
      $('ozp-player').innerHTML = '<p class="ozp-msg">Listen on your favorite platform below.</p>';
    }

    if (SHOW_LINKS) {
      Object.keys(ARTIST_LINKS).forEach(function (k) {
        var cfg = ARTIST_LINKS[k], own = String(s.row[k] || '').trim();
        var url = own && cfg.ok.test(own) ? own : (k === 'appl_music_link' && s.appleUrl ? s.appleUrl : cfg.url);
        var a = document.createElement('a');
        a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = cfg.name;
        $('ozp-links').appendChild(a);
      });
    }
    fitPlayer();   // after the buttons exist, so everything fits the box
  }).catch(function () {
    $('ozp-title').textContent = 'Listen to Danyel OZ';
    $('ozp-player').innerHTML = '<p class="ozp-msg">Find all my music on the platforms below.</p>';
    if (SHOW_LINKS) Object.keys(ARTIST_LINKS).forEach(function (k) {
      var a = document.createElement('a'); a.href = ARTIST_LINKS[k].url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = ARTIST_LINKS[k].name; $('ozp-links').appendChild(a);
    });
  });

  /* Reads Bandcamp's embed code and keeps only its player address (never runs the pasted HTML). */

  /* Bandcamp's own colors follow the site theme: black player, red links */
  function themed(src) {
    src = /\/bgcol=/.test(src) ? src.replace(/\/bgcol=\w+/, '/bgcol=000000') : src.replace(/\/?$/, '/bgcol=000000/');
    src = /\/linkcol=/.test(src) ? src.replace(/\/linkcol=\w+/, '/linkcol=e3122a') : src.replace(/\/?$/, '/linkcol=e3122a/');
    return src;
  }

  function bandcamp(code) {
    var m = String(code || '').match(/src\s*=\s*["'](https:\/\/bandcamp\.com\/EmbeddedPlayer\/[\w=\/.-]+)["']/i);
    if (!m) return null;
    var src = m[1];
    var size = (src.match(/\/size=(\w+)/) || [])[1] || 'large';
    var art = (src.match(/\/artwork=(\w+)/) || [])[1] || '';
    var px = (String(code).match(/height\s*:\s*(\d+)px/i) || [])[1];
    // 'square' = artwork-only player (minimal=true), 'art' = big cover with controls under it,
    // 'strip' = fixed-height bar (small / slim / small artwork)
    var kind = /\/minimal=true/.test(src) ? 'square'
             : size === 'large' && art !== 'small' && art !== 'none' ? 'art' : 'strip';
    return { src: themed(src), kind: kind, height: px ? Number(px) : (kind === 'strip' ? (size === 'small' ? 42 : 120) : 0) };
  }

  /* Sizes the player to the embed box, so it still fits when Google Sites shrinks the box on phones. */
  function fitPlayer() {
    var f = $('ozp-player').querySelector('iframe'); if (!f) return;
    var other = $('ozp').offsetHeight - f.offsetHeight;
    var room = window.innerHeight - other - 4;
    if (f.className !== 'ozp-bc') {                                   // Apple Music
      f.style.height = Math.max(175, Math.min(450, room)) + 'px';
      return;
    }
    if (f.dataset.kind === 'strip') { f.style.height = f.dataset.h + 'px'; return; }
    // Big player: square cover + about 120px of controls under it. Square player: just the cover.
    var extra = f.dataset.kind === 'square' ? 0 : 120;
    var width = $('ozp-player').clientWidth;
    var side = Math.max(160, Math.min(width, room - extra));
    f.style.width = side + 'px';
    f.style.height = (side + extra) + 'px';
  }
  window.addEventListener('resize', fitPlayer);
})();
</script>

</body>
</html>
