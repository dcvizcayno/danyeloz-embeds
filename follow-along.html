<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Danyel OZ: Follow Along</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<!-- Danyel OZ: Follow Along (Connect page)
     Social links as cards. Edit the list in Settings. Each opens in a new tab.
     Embed in Google Sites with Insert > Embed (Whole page):
       https://dcvizcayno.github.io/danyeloz-embeds/follow-along.html -->
<style>
  html, body { margin: 0; padding: 0; background: transparent; height: 100%; }
  #fa { font-family: 'Plus Jakarta Sans', Arial, sans-serif; height: 100%; box-sizing: border-box; overflow-y: auto; }
  #fa * { box-sizing: border-box; }
  .fa-intro { margin: 0 0 12px; font-size: 15px; line-height: 1.6; color: #1F1F1F; }
  .fa-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .fa-card { display: flex; align-items: center; gap: 12px; padding: 13px 14px; text-decoration: none; background: #050505;
    color: #f4f4f6; border-radius: 14px; min-width: 0; }
  .fa-card:hover { background: #18181b; }
  .fa-card:focus-visible { outline: 2px solid #D3413F; outline-offset: 2px; }
  .fa-card.alt { background: #1a1d2b; }
  .fa-card.alt:hover { background: #232740; }
  .fa-ico { width: 38px; height: 38px; border-radius: 10px; flex: none; display: flex; align-items: center; justify-content: center; }
  .fa-ico svg { width: 20px; height: 20px; }
  .fa-txt { flex: 1; min-width: 0; }
  .fa-name { margin: 0; font-weight: 600; font-size: 15px; }
  .fa-handle { margin: 2px 0 0; font-size: 12px; color: #a1a1aa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fa-cta { font-size: 13px; font-weight: 600; color: #f26b6b; flex: none; }
  .alt .fa-handle { color: #c4c4cc; } .alt .fa-cta { color: #c7cdf5; }
  @media (max-width: 460px) { .fa-grid { grid-template-columns: 1fr; } }
</style>

<div id="fa">
  <p class="fa-intro" id="fa-intro"></p>
  <div class="fa-grid" id="fa-grid"></div>
</div>

<script>
(function () {
  /* ================= Settings ================= */
  var INTRO = 'Hit like, leave a comment. If you feel it, follow.';
  var LINKS = [   // name, handle shown, link, button word, icon, tile color
    ['Instagram', '@danyeloz1554',            'https://www.instagram.com/danyeloz1554', 'Follow',    'instagram', '#2b1a2b'],
    ['TikTok',    '@danyel_oz',               'https://www.tiktok.com/@danyel_oz',      'Follow',    'tiktok',    '#1c2421'],
    ['YouTube',   '@danyeloz1554',            'https://www.youtube.com/@danyeloz1554',  'Subscribe', 'youtube',   '#2a1416'],
    ['X',         '@danyeloz1554',            'https://x.com/danyeloz1554',             'Follow',    'x',         '#1f1f24'],
    ['Facebook',  'DanyelOZ1554',             'https://facebook.com/DanyelOZ1554',      'Follow',    'facebook',  '#1a1d2b'],
    ['Discord',   'News first, with listeners', 'https://discord.gg/4uuTQTTq',          'Join',      'discord',   '#2c3150', 'alt']
  ];
  /* ============================================ */

  var S = 'fill="none" stroke="#e4e4e7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
  var ICONS = {
    instagram: '<svg viewBox="0 0 24 24" ' + S + '><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="#e4e4e7"/></svg>',
    tiktok:    '<svg viewBox="0 0 24 24" ' + S + '><path d="M14 4v10.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 4c.4 2.6 2.2 4.3 5 4.5"/></svg>',
    youtube:   '<svg viewBox="0 0 24 24" ' + S + '><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10.5 9.5l4 2.5-4 2.5z" fill="#e4e4e7"/></svg>',
    x:         '<svg viewBox="0 0 24 24" ' + S + '><path d="M5 5l14 14M19 5L5 19"/></svg>',
    facebook:  '<svg viewBox="0 0 24 24" ' + S + '><path d="M14.5 8H13a1.5 1.5 0 0 0-1.5 1.5V20M9 13h5.5"/><path d="M11.5 20V9.5A4.5 4.5 0 0 1 16 5h.5"/></svg>',
    discord:   '<svg viewBox="0 0 24 24" fill="none" stroke="#c7cdf5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>'
  };

  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  document.getElementById('fa-intro').textContent = INTRO;
  if (!INTRO) document.getElementById('fa-intro').style.display = 'none';
  var grid = document.getElementById('fa-grid');
  LINKS.forEach(function (l) {
    if (!/^https:\/\//.test(l[2])) return;
    var a = el('a', 'fa-card' + (l[6] ? ' ' + l[6] : '')); a.href = l[2]; a.target = '_blank'; a.rel = 'noopener';
    a.setAttribute('aria-label', l[3] + ' on ' + l[0] + ', opens in a new tab');
    var ic = el('span', 'fa-ico'); ic.style.background = l[5]; ic.setAttribute('aria-hidden', 'true'); ic.innerHTML = ICONS[l[4]] || '';
    var t = el('div', 'fa-txt'); t.appendChild(el('p', 'fa-name', l[0])); t.appendChild(el('p', 'fa-handle', l[1]));
    a.appendChild(ic); a.appendChild(t); a.appendChild(el('span', 'fa-cta', l[3]));
    grid.appendChild(a);
  });
})();
</script>

</body>
</html>
